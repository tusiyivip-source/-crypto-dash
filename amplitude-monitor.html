<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0e11">
<title>振幅监控 - 单K线振幅盯盘</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230b0e11'/><text x='16' y='22' text-anchor='middle' fill='%23f0b90b' font-size='18'>📊</text></svg>">
<style>
:root {
  --bg: #0b0e11;
  --panel-bg: #1a1e24;
  --header-bg: #14171d;
  --text: #eaecef;
  --text-secondary: #848e9c;
  --green: #0ecb81;
  --red: #f6465d;
  --yellow: #f0b90b;
  --orange: #ff9800;
  --border: #2a2f38;
  --hover: #262b33;
  --blue: #1e80ff;
  /* Amplitude color scale */
  --amp-normal: rgba(14,203,129,0.15);
  --amp-warn: rgba(240,185,11,0.2);
  --amp-danger: rgba(255,152,0,0.25);
  --amp-extreme: rgba(246,70,93,0.3);
  --amp-text-normal: #0ecb81;
  --amp-text-warn: #f0b90b;
  --amp-text-danger: #ff9800;
  --amp-text-extreme: #f6465d;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 13px; overflow-x: hidden; user-select: none;
  -webkit-font-smoothing: antialiased;
}
#app { display:flex; flex-direction:column; height:100vh; }

/* ── HEADER ── */
#header {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 20px; background:linear-gradient(180deg, #1a1e26 0%, var(--header-bg) 100%);
  border-bottom:1px solid var(--border); z-index:100; flex-shrink:0; flex-wrap:wrap; gap:10px;
}
.header-left { display:flex; align-items:center; gap:14px; }
.header-left h1 { font-size:18px; color:var(--yellow); white-space:nowrap; }
#clock { font-size:20px; font-weight:700; font-family:'Consolas',monospace; min-width:160px; }
.header-center { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
.header-right { display:flex; align-items:center; gap:12px; font-size:12px; }
#connectionDot { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 6px rgba(14,203,129,0.4); transition:all 0.3s; }
#connectionDot.disconnected { background:var(--red); box-shadow:0 0 6px rgba(246,70,93,0.4); }

.btn {
  padding:6px 14px; border:1px solid var(--border); background:var(--panel-bg);
  color:var(--text-secondary); cursor:pointer; border-radius:5px;
  font-size:12px; transition:all 0.2s; font-weight:500; white-space:nowrap;
}
.btn:hover { border-color:var(--yellow); color:var(--text); background:var(--hover); }
.btn.active { background:var(--yellow); color:#000; border-color:var(--yellow); font-weight:700; box-shadow:0 0 10px rgba(240,185,11,0.25); }
.btn.blue.active { background:var(--blue); color:#fff; border-color:var(--blue); box-shadow:0 0 8px rgba(30,128,255,0.3); }
.btn.danger { border-color:var(--red); color:var(--red); }
.btn.danger:hover { background:rgba(246,70,93,0.15); }
#muteBtn { font-size:15px; padding:6px 10px; }
#muteBtn.muted { color:var(--red); border-color:var(--red); }

/* ── STATS BAR ── */
#statsBar {
  display:flex; align-items:center; gap:24px;
  padding:8px 20px; background:var(--header-bg);
  border-bottom:1px solid var(--border); font-size:12px; flex-shrink:0; overflow-x:auto;
}
.stat-item { display:flex; align-items:center; gap:5px; white-space:nowrap; }
.stat-label { color:var(--text-secondary); font-weight:500; }
.stat-val { font-weight:600; font-family:'Consolas',monospace; }

/* ── TOOLBAR ── */
#toolbar {
  display:flex; align-items:center; gap:8px; padding:8px 16px;
  border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:wrap;
  background:rgba(0,0,0,0.15);
}
#toolbar .sep { color:var(--border); margin:0 4px; user-select:none; }
#thresholdPreset { padding:5px 10px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:4px; font-size:12px; }

/* ── TABLE ── */
#tableWrapper {
  flex:1; overflow:auto; position:relative;
}
#tableWrapper::-webkit-scrollbar { width:6px; height:6px; }
#tableWrapper::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
#tableWrapper::-webkit-scrollbar-track { background:transparent; }
#tableWrapper::-webkit-scrollbar-corner { background:transparent; }

table { width:100%; border-collapse:collapse; table-layout:fixed; min-width:900px; }
thead { position:sticky; top:0; z-index:10; }
thead th {
  background:#1a1e26; padding:8px 6px; text-align:center; font-size:11px;
  border-bottom:2px solid var(--border); color:var(--text-secondary); font-weight:600;
  cursor:pointer; white-space:nowrap; user-select:none;
}
thead th:hover { color:var(--text); background:#222730; }
thead th.sort-asc::after { content:' ▲'; }
thead th.sort-desc::after { content:' ▼'; }
thead th.sym-col { text-align:left; padding-left:12px; width:100px; }
thead th.price-col { width:90px; }
thead th.chg-col { width:80px; }
thead th.amp-col { width:72px; }

tbody td {
  padding:6px 4px; text-align:center; font-size:12px; border-bottom:1px solid rgba(255,255,255,0.03);
  font-family:'Consolas',monospace; transition:background 0.3s;
}
tbody td.sym-col { text-align:left; padding-left:12px; font-weight:700; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; letter-spacing:0.3px; }
tbody td.price-col { color:var(--text); }
tbody tr { transition:background 0.15s; }
tbody tr:hover { background:rgba(255,255,255,0.03); }
tbody tr.flash-row { animation:rowFlash 0.5s ease-out; }
@keyframes rowFlash { 0%{background:rgba(240,185,11,0.2)} 100%{background:transparent} }

/* Amplitude cell styles */
.amp-cell { border-radius:3px; font-weight:600; position:relative; }
.amp-normal { background:var(--amp-normal); color:var(--amp-text-normal); }
.amp-warn { background:var(--amp-warn); color:var(--amp-text-warn); }
.amp-danger { background:var(--amp-danger); color:var(--amp-text-danger); }
.amp-extreme { background:var(--amp-extreme); color:var(--amp-text-extreme); animation:pulseAmp 1s ease-in-out infinite; }
.amp-stale { color:var(--text-secondary); opacity:0.5; }
@keyframes pulseAmp { 0%,100%{opacity:1} 50%{opacity:0.6} }

/* Gain (single-candle change) cell styles */
.gain-cell { border-radius:3px; font-weight:600; position:relative; }
.gain-up { background:rgba(14,203,129,0.15); color:#0ecb81; }
.gain-down { background:rgba(246,70,93,0.15); color:#f6465d; }
.gain-flat { color:var(--text-secondary); opacity:0.6; }
.gain-extreme-up { background:rgba(14,203,129,0.3); color:#0ecb81; animation:pulseGain 0.8s ease-in-out infinite; }
.gain-extreme-down { background:rgba(246,70,93,0.3); color:#f6465d; animation:pulseGain 0.8s ease-in-out infinite; }
.gain-stale { color:var(--text-secondary); opacity:0.5; }
@keyframes pulseGain { 0%,100%{opacity:1} 50%{opacity:0.55} }

/* Inline sparkline for previous candle amp */
.amp-prev { font-size:10px; opacity:0.7; margin-left:3px; }

/* ── ALERT PANEL ── */
/* Pattern (engulfing) cell styles */
.pattern-cell { font-weight:700; font-size:11px; border-radius:3px; text-align:center; }
.pattern-bullish { background:rgba(14,203,129,0.18); color:#0ecb81; }
.pattern-bearish { background:rgba(246,70,93,0.18); color:#f6465d; }
.pattern-none { color:var(--text-secondary); opacity:0.35; }

/* Row with active engulfing pattern */
tbody tr.pattern-active-bullish { box-shadow:inset 3px 0 0 var(--green); }
tbody tr.pattern-active-bearish { box-shadow:inset 3px 0 0 var(--red); }

#alertPanel {
  position:fixed; right:0; top:0; bottom:0; width:320px; background:var(--panel-bg);
  border-left:1px solid var(--border); z-index:500; transform:translateX(100%);
  transition:transform 0.25s ease; display:flex; flex-direction:column;
  box-shadow:-4px 0 16px rgba(0,0,0,0.4);
}
#alertPanel.open { transform:translateX(0); }
#alertPanelHeader {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; border-bottom:1px solid var(--border); flex-shrink:0;
}
#alertPanelHeader h3 { font-size:15px; }
#alertPanelList { flex:1; overflow-y:auto; }
.alert-entry {
  padding:10px 14px; border-bottom:1px solid rgba(255,255,255,0.04);
  font-size:12px; animation:slideAlert 0.3s ease-out;
}
@keyframes slideAlert { from{transform:translateX(40px);opacity:0} to{transform:translateX(0);opacity:1} }
.alert-entry .alert-sym { font-weight:700; color:var(--yellow); }
.alert-entry .alert-amp { font-weight:600; }
.alert-entry .alert-time { font-size:10px; color:var(--text-secondary); }

/* ── TOAST ── */
#toastContainer {
  position:fixed; top:16px; right:348px; z-index:3000;
  display:flex; flex-direction:column; gap:8px; pointer-events:none;
}
.toast {
  background:var(--panel-bg); border:1px solid var(--red);
  padding:10px 16px; border-radius:8px; font-size:13px;
  animation:toastIn 0.3s ease-out; box-shadow:0 4px 16px rgba(0,0,0,0.6); max-width:320px;
}
@keyframes toastIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }

/* ── SETTINGS MODAL ── */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000;
  display:flex; align-items:center; justify-content:center;
}
.modal-box {
  background:var(--panel-bg); border:1px solid var(--border);
  border-radius:10px; padding:24px; min-width:420px; max-width:90vw; max-height:85vh; overflow-y:auto;
}
.modal-box h3 { margin-bottom:16px; font-size:16px; }
.modal-box label { font-size:12px; color:var(--text-secondary); display:block; margin-top:10px; margin-bottom:3px; }
.modal-box input[type="number"] {
  width:80px; padding:6px 10px; background:var(--bg); border:1px solid var(--border);
  color:var(--text); border-radius:4px; font-size:13px; font-family:'Consolas',monospace;
}
.modal-box input[type="number"]:focus { border-color:var(--yellow); outline:none; }
.modal-box input[type="text"],.modal-box input[type="url"] {
  width:100%; padding:7px 10px; background:var(--bg); border:1px solid var(--border);
  color:var(--text); border-radius:4px; font-size:12px; font-family:'Consolas',monospace;
}
.modal-box input[type="text"]:focus,.modal-box input[type="url"]:focus { border-color:var(--blue); outline:none; }
.modal-box select {
  padding:6px 10px; background:var(--bg); border:1px solid var(--border);
  color:var(--text); border-radius:4px; font-size:12px;
}
.modal-box select:focus { border-color:var(--blue); outline:none; }
.threshold-row { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
.threshold-row span { width:40px; font-weight:600; font-size:12px; }
.dingtalk-section { border-top:1px solid var(--border); margin-top:16px; padding-top:14px; }
.dingtalk-section h4 { font-size:14px; margin-bottom:8px; color:var(--blue); }
.dingtalk-section .hint { font-size:10px; color:var(--text-secondary); margin-top:2px; }
.dingtalk-status { display:inline-flex; align-items:center; gap:4px; font-size:11px; }
.dingtalk-status .dt-dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
.dingtalk-status .dt-dot.on { background:var(--green); box-shadow:0 0 4px rgba(14,203,129,0.4); }
.dingtalk-status .dt-dot.off { background:var(--text-secondary); }

/* ── PER-COIN ALERT POPUP ── */
.coin-alert-popup {
  position: fixed; z-index: 2500; background: var(--panel-bg);
  border:1px solid var(--yellow); border-radius:8px; width:340px; max-height:80vh; overflow-y:auto;
  box-shadow:0 6px 24px rgba(0,0,0,0.7); padding:14px; font-size:12px;
}
.coin-alert-popup h4 { font-size:14px; color:var(--yellow); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.coin-alert-popup .tf-row { display:flex; align-items:center; gap:5px; margin-bottom:5px; }
.coin-alert-popup .tf-row .tf-label { width:36px; font-weight:600; color:var(--text); font-size:11px; flex-shrink:0; }
.coin-alert-popup .tf-row input { width:50px; padding:3px 4px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:3px; font-size:10px; font-family:'Consolas',monospace; text-align:center; }
.coin-alert-popup .tf-row input:focus { border-color:var(--yellow); outline:none; }
.coin-alert-popup .tf-row label { font-size:9px; color:var(--text-secondary); flex-shrink:0; }
.coin-alert-popup .popup-actions { display:flex; gap:6px; margin-top:10px; }
.coin-alert-popup .popup-actions button { flex:1; }
.coin-alert-bell {
  display:inline-block; cursor:pointer; padding:0 4px; font-size:13px; opacity:0.4; transition:all 0.15s;
  vertical-align:middle; line-height:1;
}
.coin-alert-bell:hover { opacity:1; }
.coin-alert-bell.active { opacity:1; color:var(--yellow); filter:drop-shadow(0 0 4px rgba(240,185,11,0.5)); }

/* ── RESPONSIVE ── */
@media (max-width:768px) {
  #header { padding:8px 12px; }
  .header-center { order:3; width:100%; justify-content:center; }
  #alertPanel { width:100%; }
  #toastContainer { right:16px; }
  table { min-width:750px; }
  thead th { font-size:10px; padding:6px 3px; }
  tbody td { font-size:11px; padding:5px 3px; }
}
@media (max-width:480px) {
  #header { padding:6px 8px; }
  .header-left h1 { font-size:15px; }
  #clock { font-size:16px; min-width:130px; }
}
</style>
</head>
<body>
<div id="app">
  <!-- HEADER -->
  <header id="header">
    <div class="header-left">
      <h1>📊 振幅监控</h1>
      <span id="clock">--</span>
    </div>
    <div class="header-center">
      <button class="btn" data-count="20" onclick="app.setSymbolCount(20)">20币</button>
      <button class="btn active" data-count="30" onclick="app.setSymbolCount(30)">30币</button>
      <button class="btn" data-count="50" onclick="app.setSymbolCount(50)">50币</button>
      <button class="btn" data-count="200" onclick="app.setSymbolCount(200)">200币</button>
      <span class="sep" style="color:var(--border);margin:0 2px;">│</span>
      <select id="thresholdPreset" onchange="app.setThresholdPreset(this.value)">
        <option value="crypto">🔴 加密货币 (默认)</option>
        <option value="relaxed">🟡 宽松</option>
        <option value="tight">🟢 严格</option>
        <option value="custom">⚙️ 自定义</option>
      </select>
      <button class="btn" id="settingsBtn" onclick="app.toggleSettings()" title="自定义阈值">⚙️</button>
    </div>
    <div class="header-right">
      <span id="connectionDot" title="WebSocket"></span>
      <span id="pairCount" style="color:var(--text-secondary)">币种: 0</span>
      <button class="btn" id="muteBtn" onclick="app.toggleMute()" title="静音/取消静音">🔊</button>
      <button class="btn" id="alertListBtn" onclick="app.toggleAlertPanel()">🔔<span id="alertBadge" style="display:none;background:var(--red);color:#fff;border-radius:10px;padding:0 6px;margin-left:4px;font-size:10px;">0</span></button>
      <button class="btn" onclick="app.manualRefresh()">🔄 刷新</button>
    </div>
  </header>

  <!-- STATS BAR -->
  <div id="statsBar">
    <div class="stat-item"><span class="stat-label">监控币种:</span><span class="stat-val" id="statMonitored">0</span></div>
    <div class="stat-item"><span class="stat-label">WebSocket:</span><span class="stat-val" id="statWs">--</span></div>
    <div class="stat-item"><span class="stat-label">极端振幅:</span><span class="stat-val" style="color:var(--red)" id="statExtreme">0</span></div>
    <div class="stat-item"><span class="stat-label">高危振幅:</span><span class="stat-val" style="color:var(--orange)" id="statDanger">0</span></div>
    <div class="stat-item"><span class="stat-label">今日告警:</span><span class="stat-val" style="color:var(--yellow)" id="statAlerts">0</span></div>
    <div class="stat-item"><span class="stat-label">极端涨幅:</span><span class="stat-val" style="color:var(--red)" id="statGainExtreme">0</span></div>
    <div class="stat-item"><span class="stat-label">高危涨幅:</span><span class="stat-val" style="color:var(--orange)" id="statGainDanger">0</span></div>
    <div class="stat-item"><span class="stat-label">最近更新:</span><span class="stat-val" id="statUpdate">--</span></div>
  </div>

  <!-- TOOLBAR -->
  <div id="toolbar">
    <span style="color:var(--text-secondary);font-size:12px;">振幅排序:</span>
    <button class="btn active" onclick="app.setSort('symbol')">字母</button>
    <button class="btn" onclick="app.setSort('change_asc')">涨幅↑</button>
    <button class="btn" onclick="app.setSort('change_desc')">跌幅↑</button>
    <button class="btn" onclick="app.setSort('amp_5m')">5m振幅</button>
    <button class="btn" onclick="app.setSort('amp_15m')">15m振幅</button>
    <button class="btn" onclick="app.setSort('amp_1h')">1h振幅</button>
    <button class="btn" onclick="app.setSort('amp_4h')">4h振幅</button>
    <button class="btn" onclick="app.setSort('amp_1d')">1d振幅</button>
    <span class="sep" style="color:var(--border);">│</span>
    <span style="color:var(--blue);font-size:12px;">单K涨幅排序:</span>
    <button class="btn blue active" onclick="app.setSort('gain_5m')">5m</button>
    <button class="btn blue" onclick="app.setSort('gain_10m')">10m</button>
    <button class="btn blue" onclick="app.setSort('gain_30m')">30m</button>
    <button class="btn blue" onclick="app.setSort('gain_1h')">1h</button>
    <button class="btn blue" onclick="app.setSort('gain_2h')">2h</button>
    <button class="btn blue" onclick="app.setSort('gain_1d')">1d</button>
    <span class="sep" style="color:var(--border);">│</span>
    <label style="font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:4px;cursor:pointer;">
      <input type="checkbox" id="filterExtreme" onchange="app.toggleFilter('extreme')"> 仅极端
    </label>
    <label style="font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:4px;cursor:pointer;">
      <input type="checkbox" id="filterAlerted" onchange="app.toggleFilter('alerted')"> 仅已告警
    </label>
    <span class="sep" style="color:var(--border);">│</span>
    <label style="font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:4px;cursor:pointer;">
      <input type="checkbox" id="filterEngulfing" onchange="app.toggleFilter('engulfing')"> 仅穿线形态
    </label>
  </div>

  <!-- MAIN TABLE -->
  <div id="tableWrapper">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- ALERT PANEL -->
<div id="alertPanel">
  <div id="alertPanelHeader">
    <h3>🔔 告警记录</h3>
    <button class="btn" onclick="app.toggleAlertPanel()">✕</button>
  </div>
  <div id="alertPanelList"></div>
  <div style="padding:10px;border-top:1px solid var(--border);text-align:right;">
    <button class="btn danger" onclick="app.clearAlerts()">清空记录</button>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <h3>⚙️ 振幅阈值设置 (%)</h3>
    <div id="thresholdSettings"></div>
    <div style="margin-top:14px;">
      <label>告警冷却时间 (秒)</label>
      <input type="number" id="alertCooldown" min="0" max="600" value="30" style="width:100px;">
    </div>
    <div style="margin-top:14px;">
      <label>
        <input type="checkbox" id="soundEnabled" checked> 启用声音告警
      </label>
      <label style="margin-left:16px;">
        <input type="checkbox" id="notifyEnabled" checked> 启用浏览器通知
      </label>
    </div>
    <!-- 单K涨幅阈值 -->
    <div style="border-top:1px solid var(--border);margin-top:14px;padding-top:12px;">
      <h4 style="font-size:14px;color:var(--blue);margin-bottom:6px;">📈 单K涨幅阈值 (%)</h4>
      <div id="gainThresholdSettings"></div>
    </div>
    <!-- 钉钉推送设置 -->
    <div class="dingtalk-section">
      <h4>📨 钉钉机器人推送</h4>
      <div style="margin-bottom:8px;">
        <label style="cursor:pointer;">
          <input type="checkbox" id="dingtalkEnabled"> 启用钉钉推送
        </label>
      </div>
      <label>Webhook 地址</label>
      <input type="url" id="dingtalkWebhook" placeholder="https://oapi.dingtalk.com/robot/send?access_token=...">
      <div class="hint">钉钉群机器人 Webhook URL，支持加签方式</div>
      <label style="margin-top:8px;">CORS 代理地址 <span style="color:var(--text-secondary);font-weight:400;">(浏览器跨域需要，留空使用公共代理)</span></label>
      <input type="text" id="dingtalkCorsProxy" placeholder="例如: http://localhost:8080/">

function fmtPrice(p) {
  if (p == null || isNaN(p)) return '--';
  if (p >= 1000) return p.toFixed(2);
  if (p >= 1) return p.toFixed(4);
  return p.toFixed(6);
}
function fmtPct(p) {
  if (p == null || isNaN(p)) return '--';
  return (p >= 0 ? '+' : '') + p.toFixed(2);
}
function fmtAmp(p) {
  if (p == null || isNaN(p)) return '--';
  return p.toFixed(2) + '%';
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function now() { return Math.floor(Date.now() / 1000); }

function showToast(msg) {

// ==================== SOUND MANAGER ====================
const SoundManager = {
  _ctx: null,
  _init() {
    if (!this._ctx) {
      try { this._ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
  },
  playBeep(freq, duration, type = 'square') {
    if (STATE.muted || !STATE.soundEnabled) return;
    this._init();
    if (!this._ctx) return;
    try {
      const osc = this._ctx.createOscillator();
      const gain = this._ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this._ctx.currentTime);
      gain.gain.setValueAtTime(0.15, this._ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this._ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this._ctx.destination);
      osc.start();
      osc.stop(this._ctx.currentTime + duration);
    } catch(e) {}
  },
  alert() {
    this.playBeep(880, 0.15, 'square');

// ==================== DINGTALK PUSH ====================
// DingTalk webhook push via CORS proxy chain
// Browsers block direct cross-origin requests to oapi.dingtalk.com,
// so we try multiple CORS proxies in sequence until one succeeds.
const DINGTALK_CORS_PROXIES = [
  'https://corsproxy.io/?',
  'https://api.allorigins.win/raw?url=',
];

async function _fetchDingTalkViaProxy(proxyUrl, webhookUrl, body) {
  // Detect proxy URL format:
  // - Query-based (ends with ? or =): append &{encodedUrl}  e.g. corsproxy.io/?
  // - Path-based (cors-anywhere style): append raw URL  e.g. localhost:8080/
  let targetUrl;
  if (proxyUrl.includes('?') || proxyUrl.endsWith('=')) {
    targetUrl = proxyUrl + encodeURIComponent(webhookUrl);
  } else {
    targetUrl = proxyUrl + webhookUrl;
  }
  const resp = await fetch(targetUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: body,
  });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return resp.json();
}

async function sendDingTalkMessage(title, text) {
  if (!STATE.dingtalkEnabled || !STATE.dingtalkWebhook) return;
  const payload = {
    msgtype: 'markdown',
    markdown: { title: title, text: text },
  };
  const body = JSON.stringify(payload);

  // Strategy 1: direct fetch (some networks / newer DingTalk endpoints allow it)
  try {
    const resp = await fetch(STATE.dingtalkWebhook, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body,
    });
    const data = await resp.json();
    if (data.errcode === 0) return;
    console.warn('[DingTalk] Direct push failed:', data.errmsg || data);
  } catch(e) {
    // Direct blocked by CORS, fall through to proxies
  }

  // Strategy 2: try custom CORS proxy first if configured
  if (STATE.dingtalkCorsProxy) {
    try {
      const data = await _fetchDingTalkViaProxy(STATE.dingtalkCorsProxy, STATE.dingtalkWebhook, body);
      if (data.errcode === 0) return;
      console.warn('[DingTalk] Custom proxy returned error:', data.errmsg || data);
    } catch(e) {
      console.warn('[DingTalk] Custom proxy failed, trying public proxies...');
    }
  }

  // Strategy 3: try public CORS proxies
  for (const proxy of DINGTALK_CORS_PROXIES) {
    try {
      const data = await _fetchDingTalkViaProxy(proxy, STATE.dingtalkWebhook, body);
      if (data.errcode === 0) {
        console.log('[DingTalk] Push succeeded via proxy:', proxy);
        return;
      }
      console.warn('[DingTalk] Proxy returned error:', data.errmsg || data);
    } catch(e) {
      // This proxy failed, try the next one
      continue;
    }
  }

  console.warn('[DingTalk] All push strategies failed. Check webhook URL and network.');
}

function shouldDingTalkPush(level) {
  if (!STATE.dingtalkEnabled || !STATE.dingtalkWebhook) return false;
  const levels = ['warn', 'danger', 'extreme'];
  const thresholdIdx = levels.indexOf(STATE.dingtalkPushLevel);
  const currentIdx = levels.indexOf(level);
  return currentIdx >= thresholdIdx;
}

// ==================== BINANCE API ====================
const BinanceAPI = {
  _pending: Promise.resolve(),
  _rateLimitQueue: [],
  _rateLimitTimer: null,
  _rateLimitedFetch(url) {
    return new Promise((resolve, reject) => {
      this._rateLimitQueue.push({ url, resolve, reject });
      if (!this._rateLimitTimer) {
        this._rateLimitTimer = setInterval(() => {
          const task = this._rateLimitQueue.shift();
          if (!task) { clearInterval(this._rateLimitTimer); this._rateLimitTimer = null; return; }
          fetch(task.url)
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(task.resolve, task.reject);
        }, 10);
      }
    });
  },
  async _throttledFetch(url) {
    const req = this._pending.then(() => sleep(60));
    this._pending = req;
    await req;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return resp.json();
  },
  fetchJSON(url) { return this._throttledFetch(url); },
  fetchKlinesBulk(symbol, interval, limit) {
    limit = limit || 3;
    return this._rateLimitedFetch(
      CONFIG.BINANCE_REST + '/klines?symbol=' + symbol + '&interval=' + interval + '&limit=' + limit
    ).then(function(data) {
      return data.map(function(d) {
        return {
          time: Math.floor(d[0] / 1000),
          open: parseFloat(d[1]),
          high: parseFloat(d[2]),
          low: parseFloat(d[3]),
          close: parseFloat(d[4]),
          volume: parseFloat(d[5]),
          isClosed: true,
        };
      });
    });
  },

  async getTopPairs(limit) {
    const tickers = await this.fetchJSON(`${CONFIG.BINANCE_REST}/ticker/24hr`);
    return tickers
      .filter(t => t.symbol.endsWith('USDT') && !t.symbol.includes('BUSD') && !t.symbol.includes('TUSD'))
      .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
      .slice(0, limit)
      .map(t => ({
        symbol: t.symbol,
        lastPrice: parseFloat(t.lastPrice),
        priceChangePercent: parseFloat(t.priceChangePercent),
        quoteVolume: parseFloat(t.quoteVolume),
      }));
  },

  async getKlines(symbol, interval, limit) {
    limit = limit || 3;
    return this.fetchKlinesBulk(symbol, interval, limit);
  },

  // Build combined WebSocket stream URL
  connectWebSocket(streams, onMessage) {
    // Split into chunks of MAX_WS_STREAMS
    const connections = [];
    for (let i = 0; i < streams.length; i += CONFIG.MAX_WS_STREAMS) {
      const chunk = streams.slice(i, i + CONFIG.MAX_WS_STREAMS);
      const url = `${CONFIG.BINANCE_WS}?streams=${chunk.join('/')}`;
      connections.push(this._createWS(url, onMessage));
    }
    return connections;
  },

  _createWS(url, onMessage) {
    function connect() {
      const ws = new WebSocket(url);
      ws.onopen = () => {
        STATE.wsConnected = true;
        updateConnectionUI();
      };
      ws.onmessage = (evt) => {
        try {
          const msg = JSON.parse(evt.data);
          let klineData = null;
          // Combined stream format: {"stream":"...","data":{...}}
          if (msg.stream && msg.data && msg.data.e === 'kline') {
            klineData = msg.data;
          }
          // Single stream format: {"e":"kline",...}
          else if (msg.e === 'kline') {
            klineData = msg;
          }
          if (klineData) onMessage(klineData);
        } catch(e) {}
      };
      ws.onclose = () => {
        STATE.wsConnected = false;
        updateConnectionUI();
        STATE.wsReconnectTimer = setTimeout(connect, 5000);
      };
      ws.onerror = () => {
        STATE.wsConnected = false;
        updateConnectionUI();
      };
      return ws;
    }
    const ws = connect();
    STATE.wsConnections.push(ws);
    return ws;
  },
};

// ==================== MAIN APPLICATION ====================
class AmplitudeMonitor {
  constructor() {
    this.tableBody = document.getElementById('tableBody');
    this.tableHead = document.getElementById('tableHead');
    this.cellRefs = {};  // { 'BTCUSDT_5m': <td> }
    this.rowRefs = {};   // { 'BTCUSDT': <tr> }
    this._savePending = false;
  }

  async init() {
    this.startClock();
    this.loadState();
    this.renderThresholdSettings();
    this.updateThresholdPresetUI();
    this.updateMuteUI();
    this.buildTableHeader();

    // Request notification permission early
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }

    await this.loadData();
    // startWebSocket() already called inside loadData() for early data flow
    this.startPeriodicRefresh();
    this.startStatsUpdater();
    STATE.initDone = true;
  }

  loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem('amp_monitor_state') || '{}');
      if (saved.symbolCount) STATE.symbolCount = saved.symbolCount;
      if (saved.thresholdPreset) STATE.thresholdPreset = saved.thresholdPreset;
      if (saved.thresholds) STATE.thresholds = saved.thresholds;
      if (saved.alertLog) STATE.alertLog = saved.alertLog;
      if (saved.alertCooldownSec != null) STATE.alertCooldownSec = saved.alertCooldownSec;
      if (saved.perCoinAlerts) STATE.perCoinAlerts = saved.perCoinAlerts;
      if (saved.gainThresholds) STATE.gainThresholds = saved.gainThresholds;
      if (saved.gainAlerts) STATE.gainAlerts = saved.gainAlerts;
    } catch(e) {}
    STATE.soundEnabled = localStorage.getItem('amp_monitor_sound') !== 'false';
    STATE.notifyEnabled = localStorage.getItem('amp_monitor_notify') !== 'false';
    STATE.muted = localStorage.getItem('amp_monitor_muted') === 'true';
    STATE.dingtalkEnabled = localStorage.getItem('amp_monitor_dingtalk_enabled') === 'true';
    STATE.dingtalkWebhook = localStorage.getItem('amp_monitor_dingtalk_webhook') || '';
    STATE.dingtalkCorsProxy = localStorage.getItem('amp_monitor_dingtalk_cors_proxy') || '';
    STATE.dingtalkPushLevel = localStorage.getItem('amp_monitor_dingtalk_level') || 'danger';
    STATE.dingtalkPushPattern = localStorage.getItem('amp_monitor_dingtalk_pattern') !== 'false';
    this.updateSymbolCountUI();
  }

  saveState() {
    // Debounce: batch rapid saveState calls into one write per 500ms
    if (this._savePending) return;
    this._savePending = true;
    var self = this;
    setTimeout(function() {
      self._savePending = false;
      self._saveStateNow();
    }, 500);
  }
  _saveStateNow() {
    try {
      localStorage.setItem('amp_monitor_state', JSON.stringify({
        symbolCount: STATE.symbolCount,
        thresholdPreset: STATE.thresholdPreset,
        thresholds: STATE.thresholds,
        gainThresholds: STATE.gainThresholds,
        alertLog: STATE.alertLog.slice(-200),
        alertCooldownSec: STATE.alertCooldownSec,
        perCoinAlerts: STATE.perCoinAlerts,
        gainAlerts: STATE.gainAlerts.slice(-200),
      }));
      localStorage.setItem('amp_monitor_sound', STATE.soundEnabled);
      localStorage.setItem('amp_monitor_notify', STATE.notifyEnabled);
      localStorage.setItem('amp_monitor_dingtalk_enabled', STATE.dingtalkEnabled);
      localStorage.setItem('amp_monitor_dingtalk_webhook', STATE.dingtalkWebhook);
      localStorage.setItem('amp_monitor_dingtalk_cors_proxy', STATE.dingtalkCorsProxy);
      localStorage.setItem('amp_monitor_dingtalk_level', STATE.dingtalkPushLevel);
      localStorage.setItem('amp_monitor_dingtalk_pattern', STATE.dingtalkPushPattern);
    } catch(e) {}
  }

  // ── DATA LOADING ──
  async loadData() {
    document.getElementById('statUpdate').textContent = '加载中...';
    document.getElementById('statUpdate').style.color = 'var(--yellow)';

    try {
      // Fetch top pairs
      const pairs = await BinanceAPI.getTopPairs(STATE.symbolCount);
      STATE.symbols = pairs.map(p => p.symbol);
      for (const p of pairs) {
        STATE.pairMeta[p.symbol] = {
          lastPrice: p.lastPrice,
          priceChangePercent: p.priceChangePercent,
          quoteVolume: p.quoteVolume,
        };
      }

      // Start WebSocket early so data flows in parallel with REST loading
      this.startWebSocket();

      // Fetch klines for all symbols × timeframes with controlled concurrency
      const CONCURRENCY = 20;
      const tasks = [];
      for (const sym of STATE.symbols) {
        for (const tf of STATE.timeframes) {
          tasks.push({ sym, tf });
        }
        // Also fetch gain-only timeframes (10m, 2h)
        for (const tf of CONFIG.GAIN_EXTRA_TF) {
          tasks.push({ sym, tf, isGainExtra: true });
        }
      }

      // Process in batches using the fast rate limiter (no 60ms throttle)
      for (let i = 0; i < tasks.length; i += CONCURRENCY) {
        const batch = tasks.slice(i, i + CONCURRENCY);
        await Promise.all(batch.map(async ({ sym, tf, isGainExtra }) => {
          try {
            const candles = await BinanceAPI.fetchKlinesBulk(sym, tf, CONFIG.KLINE_LIMIT);
            if (isGainExtra) {
              this.processInitialGainKlines(sym, tf, candles);
            } else {
              this.processInitialKlines(sym, tf, candles);
            }
          } catch(e) {
            // Will be filled by WebSocket later
          }
        }));
      }

      // Build table rows (uses DocumentFragment for fast DOM insertion)
      this.buildTableBody();
      this.updateStats();
      document.getElementById('pairCount').textContent = `币种: ${STATE.symbols.length}`;
      document.getElementById('statUpdate').textContent = '✓ 就绪';
      document.getElementById('statUpdate').style.color = 'var(--green)';
    } catch(e) {
      console.error('[AmplitudeMonitor] loadData error:', e);
      document.getElementById('statUpdate').textContent = '✗ 加载失败';
      document.getElementById('statUpdate').style.color = 'var(--red)';
    }
  }

  processInitialKlines(sym, tf, candles) {
    if (!candles || candles.length < 2) return;
    if (!STATE.klineCache[sym]) STATE.klineCache[sym] = {};

    const current = candles[candles.length - 1];
    const prev = candles[candles.length - 2];

    const currentAmp = current.open > 0 ? ((current.high - current.low) / current.open) * 100 : 0;
    const prevAmp = prev.open > 0 ? ((prev.high - prev.low) / prev.open) * 100 : 0;

    // Store raw candles for pattern detection
    const rawCandles = candles.map(c => ({
      time: c.time, open: c.open, high: c.high, low: c.low, close: c.close, isClosed: true
    }));

    STATE.klineCache[sym][tf] = {
      open: current.open,
      high: current.high,
      low: current.low,
      close: current.close,
      amplitude: currentAmp,
      prevAmplitude: prevAmp,
      time: current.time,
      isClosed: true, // REST data is always closed candles
      lastUpdate: now(),
      candles: rawCandles,
    };

    // Compute initial gain for shared timeframes
    if (CONFIG.GAIN_TIMEFRAMES.includes(tf)) {
      const gainPct = current.open > 0 ? ((current.close - current.open) / current.open) * 100 : 0;
      if (!STATE.gainCache[sym]) STATE.gainCache[sym] = {};
      STATE.gainCache[sym][tf] = {
        changePct: gainPct, direction: gainPct >= 0 ? 'up' : 'down',
        open: current.open, close: current.close,
        isClosed: true, time: current.time, lastUpdate: now(),
      };
    }

    // Run pattern detection on initial load
    this.detectAndUpdatePattern(sym, tf);
  }

  processInitialGainKlines(sym, tf, candles) {
    if (!candles || candles.length < 1) return;
    const current = candles[candles.length - 1];
    if (current.open <= 0) return;
    const changePct = ((current.close - current.open) / current.open) * 100;
    if (!STATE.gainCache[sym]) STATE.gainCache[sym] = {};
    STATE.gainCache[sym][tf] = {
      changePct, direction: changePct >= 0 ? 'up' : 'down',
      open: current.open, close: current.close,
      isClosed: true, time: current.time, lastUpdate: now(),
    };
    // Also init gainKlineCache for gain-only TFs
    if (CONFIG.GAIN_EXTRA_TF.includes(tf)) {
      if (!STATE.gainKlineCache[sym]) STATE.gainKlineCache[sym] = {};
      STATE.gainKlineCache[sym][tf] = {
        open: current.open, high: current.high, low: current.low, close: current.close,
        changePct, direction: changePct >= 0 ? 'up' : 'down',
        amplitude: ((current.high - current.low) / current.open) * 100,
        isClosed: true, time: current.time, lastUpdate: now(),
      };
    }
    this.updateGainCell(sym, tf);
  }

  // ── WEBSOCKET ──
  startWebSocket() {
    // Disconnect existing
    this.disconnectWS();

    // Build stream list
    const streams = [];
    for (const sym of STATE.symbols) {
      for (const tf of STATE.timeframes) {
        streams.push(`${sym.toLowerCase()}@kline_${tf}`);
      }
      // Extra streams for gain-only timeframes (10m, 2h)
      for (const tf of CONFIG.GAIN_EXTRA_TF) {
        streams.push(`${sym.toLowerCase()}@kline_${tf}`);
      }
    }

    // Start WebSocket connections
    BinanceAPI.connectWebSocket(streams, (klineData) => {
      this.handleWSKline(klineData);
    });

    document.getElementById('statWs').textContent = `${streams.length}流`;
    document.getElementById('statWs').style.color = 'var(--green)';
    updateConnectionUI();
  }

  disconnectWS() {
    if (STATE.wsReconnectTimer) { clearTimeout(STATE.wsReconnectTimer); STATE.wsReconnectTimer = null; }
    for (const ws of STATE.wsConnections) {
      try { ws.close(); } catch(e) {}
    }
    STATE.wsConnections = [];
    STATE.wsConnected = false;
    updateConnectionUI();
  }

  handleWSKline(data) {
    const k = data.k;
    const sym = k.s;
    const tf = k.i;
    const o = parseFloat(k.o);
    const h = parseFloat(k.h);
    const l = parseFloat(k.l);
    const c = parseFloat(k.c);
    const isClosed = k.x;

    if (o <= 0) return;

    if (!STATE.klineCache[sym]) STATE.klineCache[sym] = {};

    const prevData = STATE.klineCache[sym][tf];
    let prevAmp = prevData ? prevData.amplitude : 0;

    // If candle closed, the current amplitude becomes the previous
    if (isClosed && prevData && !prevData.isClosed) {
      prevAmp = prevData.amplitude;
    }

    const amplitude = ((h - l) / o) * 100;
    const klineTime = Math.floor(k.t / 1000);

    // Maintain candle array for pattern detection
    let candleArr = (prevData && prevData.candles) ? [...prevData.candles] : [];
    const existingIdx = candleArr.findIndex(c => c.time === klineTime);
    const candleEntry = { time: klineTime, open: o, high: h, low: l, close: c, isClosed };

    if (existingIdx >= 0) {
      candleArr[existingIdx] = candleEntry;
    } else {
      candleArr.push(candleEntry);
      if (candleArr.length > 6) candleArr = candleArr.slice(-6);
    }

    STATE.klineCache[sym][tf] = {
      open: o, high: h, low: l, close: c,
      amplitude, prevAmplitude: prevAmp,
      time: klineTime,
      isClosed,
      lastUpdate: now(),
      candles: candleArr,
    };

    // Update cell display
    this.updateCell(sym, tf);

    // Check thresholds and alert
    this.checkAmplitudeAlert(sym, tf, amplitude);

    // Compute gain for shared timeframes (5m, 30m, 1h, 1d)
    if (CONFIG.GAIN_TIMEFRAMES.includes(tf)) {
      this.computeAndUpdateGain(sym, tf, o, c, isClosed, klineTime);
    }
    // Also handle gain-only timeframes (10m, 2h)
    if (CONFIG.GAIN_EXTRA_TF.includes(tf)) {
      this.handleGainKline(sym, tf, o, h, l, c, isClosed, klineTime);
    }

    // Check engulfing pattern
    this.detectAndUpdatePattern(sym, tf);

    // Update pair meta price
    if (STATE.pairMeta[sym]) {
      const oldPrice = STATE.pairMeta[sym].lastPrice;
      STATE.pairMeta[sym].lastPrice = c;
      if (tf === STATE.timeframes[0]) {
        // Update price column for the shortest timeframe
        this.updatePriceCell(sym, c);
      }
    }
  }

  // ── ALERT CHECKING ──
  checkAmplitudeAlert(sym, tf, amplitude) {
    // Use per-coin thresholds if enabled, fall back to global
    let thresholds;
    if (STATE.perCoinAlerts[sym] && STATE.perCoinAlerts[sym].enabled) {
      thresholds = STATE.perCoinAlerts[sym].thresholds[tf];
    }
    if (!thresholds || !thresholds.warn) {
      thresholds = STATE.thresholds[tf];
    }
    if (!thresholds) return;

    let level = null;
    if (amplitude >= thresholds.extreme) level = 'extreme';
    else if (amplitude >= thresholds.danger) level = 'danger';
    else if (amplitude >= thresholds.warn) level = 'warn';

    if (!level) return;

    // Cooldown check
    const cooldownKey = `${sym}_${tf}_${level}`;
    const lastAlert = STATE.alertCooldown[cooldownKey];
    if (lastAlert && (now() - lastAlert) < STATE.alertCooldownSec) return;

    STATE.alertCooldown[cooldownKey] = now();

    // Create alert record
    const alert = {
      id: Date.now(),
      sym, tf, amplitude, level, thresholds: thresholds[level],
      time: now(),
    };
    STATE.alerts.push(alert);
    STATE.alertLog.push(alert);
    if (STATE.alertLog.length > 500) STATE.alertLog = STATE.alertLog.slice(-500);

    // Visual feedback
    this.flashRow(sym);
    this.updateAlertBadge();
    this.renderAlertPanel();

    // Sound
    if (level === 'extreme') {
      SoundManager.extreme();
    } else {
      SoundManager.alert();
    }

    // Toast
    const levelLabel = { warn:'⚠️ 警告', danger:'🔶 高危', extreme:'🔴 极端' };
    showToast(`${levelLabel[level]} ${sym} ${CONFIG.TF_LABELS[tf]} 振幅 ${fmtAmp(amplitude)}`);

    // Browser notification for extreme/danger
    if (level === 'extreme' || level === 'danger') {
      sendBrowserNotification(
        `${levelLabel[level]}振幅 - ${sym}`,
        `${CONFIG.TF_LABELS[tf]} K线振幅达到 ${amplitude.toFixed(2)}% (阈值: ${thresholds[level]}%)`
      );
    }

    // DingTalk push
    if (shouldDingTalkPush(level)) {
      const coinName = sym.replace('USDT', '');
      const dtTitle = `${levelLabel[level]}振幅告警 - ${sym}`;
      const dtText = `## ${levelLabel[level]} 振幅告警\n\n` +
        `**币种**: ${sym} (${coinName})\n\n` +
        `**时间周期**: ${CONFIG.TF_LABELS[tf]}\n\n` +
        `**当前振幅**: <font color="${level === 'extreme' ? '#f6465d' : level === 'danger' ? '#ff9800' : '#f0b90b'}">${amplitude.toFixed(2)}%</font>\n\n` +
        `**触发阈值**: ${thresholds[level]}%\n\n` +
        `**告警时间**: ${new Date().toLocaleString('zh-CN', { hour12: false })}\n\n` +
        `> 振幅监控系统自动推送`;
      sendDingTalkMessage(dtTitle, dtText);
    }

    this.saveState();
    this.updateStats();
  }

  // ── ENGULFING PATTERN DETECTION (一阳穿三阴 / 一阴穿三阳) ──
  detectEngulfingPattern(sym, tf) {
    const data = STATE.klineCache[sym] && STATE.klineCache[sym][tf];
    if (!data || !data.candles || data.candles.length < 4) return null;

    const candles = data.candles;
    const c0 = candles[candles.length - 1]; // current
    const c1 = candles[candles.length - 2]; // previous 1
    const c2 = candles[candles.length - 3]; // previous 2
    const c3 = candles[candles.length - 4]; // previous 3

    const isBullish = (c) => c.close > c.open;
    const isBearish = (c) => c.close < c.open;

    // 一阳穿三阴: current bullish, prev 3 all bearish, current engulfs all 3
    if (isBullish(c0) && isBearish(c1) && isBearish(c2) && isBearish(c3)) {
      const prevHigh = Math.max(c1.high, c2.high, c3.high);
      const prevLow = Math.min(c1.low, c2.low, c3.low);
      if (c0.high >= prevHigh && c0.low <= prevLow) {
        return { type: 'bullish_engulf', label: '一阳穿三阴', emoji: '🟢', shortLabel: '阳包阴' };
      }
    }

    // 一阴穿三阳: current bearish, prev 3 all bullish, current engulfs all 3
    if (isBearish(c0) && isBullish(c1) && isBullish(c2) && isBullish(c3)) {
      const prevHigh = Math.max(c1.high, c2.high, c3.high);
      const prevLow = Math.min(c1.low, c2.low, c3.low);
      if (c0.high >= prevHigh && c0.low <= prevLow) {
        return { type: 'bearish_engulf', label: '一阴穿三阳', emoji: '🔴', shortLabel: '阴包阳' };
      }
    }

    return null;
  }

  detectAndUpdatePattern(sym, tf) {
    const pattern = this.detectEngulfingPattern(sym, tf);
    const patternKey = `${sym}_${tf}`;
    const prevPattern = STATE.patternCache[patternKey];

    if (pattern) {
      const prevType = prevPattern ? prevPattern.type : null;
      STATE.patternCache[patternKey] = {
        type: pattern.type,
        label: pattern.label,
        emoji: pattern.emoji,
        shortLabel: pattern.shortLabel,
        time: now(),
        isClosed: STATE.klineCache[sym][tf].isClosed,
      };

      // Alert only when pattern first appears or changes type, AND after init
      if (STATE.initDone && (!prevPattern || prevType !== pattern.type)) {
        this.triggerPatternAlert(sym, tf, pattern);
      }
    } else if (prevPattern) {
      delete STATE.patternCache[patternKey];
    }

    // Update the pattern cell in table
    this.updatePatternCell(sym, tf);
    // Update row styling
    this.updatePatternRowStyle(sym);
  }

  triggerPatternAlert(sym, tf, pattern) {
    // Skip alerts during initial load
    if (!STATE.initDone) return;

    // Cooldown check
    const cooldownKey = `${sym}_${tf}_pattern`;
    const lastAlert = STATE.patternCooldown[cooldownKey];
    if (lastAlert && (now() - lastAlert) < STATE.alertCooldownSec) return;
    STATE.patternCooldown[cooldownKey] = now();

    const isClosed = STATE.klineCache[sym][tf].isClosed;
    const statusTag = isClosed ? ' [已确认]' : ' [形成中]';

    // Log pattern alert
    STATE.patternAlerts.push({
      id: Date.now(),
      sym, tf, type: pattern.type, label: pattern.label,
      time: now(), isClosed,
    });
    if (STATE.patternAlerts.length > 200) STATE.patternAlerts = STATE.patternAlerts.slice(-200);

    // Row flash
    this.flashRow(sym);

    // Sound - ascending for bullish, descending for bearish
    if (pattern.type === 'bullish_engulf') {
      SoundManager.patternBullish();
    } else {
      SoundManager.patternBearish();
    }

    // Toast
    showToast(`${pattern.emoji} ${sym} ${CONFIG.TF_LABELS[tf]} ${pattern.label}${statusTag}`);

    // Browser notification
    sendBrowserNotification(
      `${pattern.label} - ${sym}`,
      `${CONFIG.TF_LABELS[tf]} K线 ${pattern.label} 形态${statusTag}`
    );

    // DingTalk push for pattern
    if (STATE.dingtalkEnabled && STATE.dingtalkWebhook && STATE.dingtalkPushPattern) {
      const coinName = sym.replace('USDT', '');
      const dtTitle = `${pattern.emoji} ${pattern.label} - ${sym}`;
      const dtText = `## ${pattern.emoji} ${pattern.label}\n\n` +
        `**币种**: ${sym} (${coinName})\n\n` +
        `**时间周期**: ${CONFIG.TF_LABELS[tf]}\n\n` +
        `**形态状态**: ${statusTag}\n\n` +
        `**检测时间**: ${new Date().toLocaleString('zh-CN', { hour12: false })}\n\n` +
        `> 振幅监控系统自动推送`;
      sendDingTalkMessage(dtTitle, dtText);
    }

    this.updateStats();
    this.saveState();
  }

  updatePatternRowStyle(sym) {
    const row = this.rowRefs[sym];
    if (!row) return;

    // Check if any timeframe has an active pattern
    let activePattern = null;
    for (const tf of STATE.timeframes) {
      const key = `${sym}_${tf}`;
      if (STATE.patternCache[key]) {
        activePattern = STATE.patternCache[key];
        break;
      }
    }

    row.classList.remove('pattern-active-bullish', 'pattern-active-bearish');
    if (activePattern) {
      row.classList.add(activePattern.type === 'bullish_engulf' ? 'pattern-active-bullish' : 'pattern-active-bearish');
    }
  }

  // ── GAIN (单K涨幅) METHODS ──
  computeAndUpdateGain(sym, tf, o, c, isClosed, klineTime) {
    if (o <= 0) return;
    const changePct = ((c - o) / o) * 100;
    if (!STATE.gainCache[sym]) STATE.gainCache[sym] = {};
    STATE.gainCache[sym][tf] = {
      changePct, direction: changePct >= 0 ? 'up' : 'down',
      open: o, close: c, isClosed, time: klineTime, lastUpdate: now(),
    };
    this.updateGainCell(sym, tf);
    this.checkGainAlert(sym, tf, changePct);
  }

  handleGainKline(sym, tf, o, h, l, c, isClosed, klineTime) {
    // For gain-only timeframes (10m, 2h): store raw kline data and compute gain
    if (o <= 0) return;
    if (!STATE.gainKlineCache[sym]) STATE.gainKlineCache[sym] = {};
    const changePct = ((c - o) / o) * 100;
    STATE.gainKlineCache[sym][tf] = {
      open: o, high: h, low: l, close: c,
      changePct, direction: changePct >= 0 ? 'up' : 'down',
      amplitude: ((h - l) / o) * 100,
      isClosed, time: klineTime, lastUpdate: now(),
    };
    this.computeAndUpdateGain(sym, tf, o, c, isClosed, klineTime);
  }

  updateGainCell(sym, tf) {
    const key = 'gain_' + sym + '_' + tf;
    const cell = this.cellRefs[key];
    if (!cell) return;

    const data = STATE.gainCache[sym] && STATE.gainCache[sym][tf];
    if (!data) return;

    const chg = data.changePct;
    const absChg = Math.abs(chg);
    const th = STATE.gainThresholds[tf];

    // Determine level
    let cssClass = 'gain-flat';
    if (th && absChg >= th.extreme) cssClass = chg >= 0 ? 'gain-extreme-up' : 'gain-extreme-down';
    else if (th && absChg >= th.danger) cssClass = chg >= 0 ? 'gain-up' : 'gain-down';
    else if (th && absChg >= th.warn) cssClass = chg >= 0 ? 'gain-up' : 'gain-down';
    else if (Math.abs(chg) > 0.001) cssClass = chg >= 0 ? 'gain-up' : 'gain-down';

    cell.className = 'gain-cell ' + cssClass;
    const sign = chg >= 0 ? '+' : '';
    cell.textContent = sign + chg.toFixed(2) + '%';
    var levelLabel = absChg < 0.001 ? '平盘' : absChg >= (th ? th.extreme : 99) ? '极端' : absChg >= (th ? th.danger : 99) ? '高危' : absChg >= (th ? th.warn : 99) ? '警告' : '正常';
    cell.title = sym + ' ' + CONFIG.GAIN_TF_LABELS[tf] + '\n涨幅: ' + sign + chg.toFixed(2) + '%\n开: ' + fmtPrice(data.open) + ' 收: ' + fmtPrice(data.close) + '\n状态: ' + levelLabel + (th ? '\n阈值: >' + th.warn + '%/>' + th.danger + '%/>' + th.extreme + '%' : '');
  }

  checkGainAlert(sym, tf, changePct) {
    const absChg = Math.abs(changePct);
    const th = STATE.gainThresholds[tf];
    if (!th) return;

    let level = null;
    if (absChg >= th.extreme) level = 'extreme';
    else if (absChg >= th.danger) level = 'danger';
    else if (absChg >= th.warn) level = 'warn';
    if (!level) return;

    // Cooldown
    const key = sym + '_' + tf + '_gain_' + level;
    const last = STATE.gainAlertCooldown[key];
    if (last && (now() - last) < STATE.alertCooldownSec) return;
    STATE.gainAlertCooldown[key] = now();

    const dir = changePct >= 0 ? '拉升' : '砸盘';
    const emoji = changePct >= 0 ? '🚀' : '📉';
    const alert = {
      id: Date.now(), sym, tf, changePct, absChg, level, direction: dir,
      thresholds: th[level], time: now(),
    };
    STATE.gainAlerts.push(alert);
    if (STATE.gainAlerts.length > 500) STATE.gainAlerts = STATE.gainAlerts.slice(-500);

    // Also add to general alert log
    STATE.alertLog.push({
      id: Date.now(), sym, tf, amplitude: absChg, level,
      time: now(), _isGain: true, _direction: dir,
    });

    this.flashRow(sym);
    this.updateAlertBadge();

    // Sound
    if (changePct >= 0) {
      SoundManager.patternBullish();
    } else {
      SoundManager.patternBearish();
    }

    // Toast
    const lvlLabel = { warn: '⚠️', danger: '🔶', extreme: '🔴' };
    showToast(emoji + ' ' + lvlLabel[level] + ' ' + sym + ' ' + CONFIG.GAIN_TF_LABELS[tf] + ' ' + dir + ' ' + (changePct >= 0 ? '+' : '') + changePct.toFixed(2) + '%');

    // Browser notification
    if (level === 'extreme' || level === 'danger') {
      sendBrowserNotification(
        (changePct >= 0 ? '🚀' : '📉') + ' ' + lvlLabel[level] + '涨幅 - ' + sym,
        CONFIG.GAIN_TF_LABELS[tf] + ' 单K' + dir + ' ' + (changePct >= 0 ? '+' : '') + changePct.toFixed(2) + '% (阈值: ' + th[level] + '%)'
      );
    }

    // DingTalk
    if (shouldDingTalkPush(level)) {
      const coinName = sym.replace('USDT', '');
      const dtTitle = emoji + ' ' + lvlLabel[level] + '单K涨幅告警 - ' + sym;
      const dtText = '## ' + emoji + ' ' + lvlLabel[level] + ' 单K涨幅告警\n\n' +
        '**币种**: ' + sym + ' (' + coinName + ')\n\n' +
        '**时间周期**: ' + CONFIG.GAIN_TF_LABELS[tf] + '\n\n' +
        '**方向**: ' + dir + '\n\n' +
        '**涨跌幅**: ' + (changePct >= 0 ? '+' : '') + changePct.toFixed(2) + '%\n\n' +
        '**触发阈值**: ' + th[level] + '%\n\n' +
        '**时间**: ' + new Date().toLocaleString('zh-CN', { hour12: false }) + '\n\n' +
        '> 振幅监控系统自动推送';
      sendDingTalkMessage(dtTitle, dtText);
    }

    this.updateStats();
  }

  flashRow(sym) {
    const row = this.rowRefs[sym];
    if (!row) return;
    row.classList.remove('flash-row');
    void row.offsetWidth;
    row.classList.add('flash-row');
  }

  // ── UI UPDATES ──
  buildTableHeader() {
    let html = '<tr>';
    html += '<th class="sym-col" onclick="app.setSort(\'symbol\')">币种</th>';
    html += '<th class="price-col" onclick="app.setSort(\'price\')">价格</th>';
    html += '<th class="chg-col" onclick="app.setSort(\'change_desc\')">24h涨跌</th>';
    for (const tf of STATE.timeframes) {
      html += `<th class="amp-col" onclick="app.setSort('amp_${tf}')" title="${CONFIG.TF_LABELS[tf]}">${tf}</th>`;
    }
    for (const tf of CONFIG.GAIN_TIMEFRAMES) {
      html += `<th class="amp-col" onclick="app.setSort('gain_${tf}')" title="${CONFIG.GAIN_TF_LABELS[tf]}单K涨幅" style="color:var(--blue);">涨${tf}</th>`;
    }
    html += '<th class="amp-col" style="width:72px;" title="一阳穿三阴 / 一阴穿三阳 形态">形态</th>';
    html += '</tr>';
    this.tableHead.innerHTML = html;
  }

    this.cellRefs = {};
    this.rowRefs = {};
