    for (const sym of sorted) {
      const meta = STATE.pairMeta[sym] || {};
      const tr = document.createElement('tr');
      tr.id = `row-${sym}`;
      this.rowRefs[sym] = tr;

      // Symbol (with per-coin alert bell)
      const tdSym = document.createElement('td');
      tdSym.className = 'sym-col';
      tdSym.style.whiteSpace = 'nowrap';
      const coinName = sym.replace('USDT', '');
      const hasCustomAlert = STATE.perCoinAlerts[sym] && STATE.perCoinAlerts[sym].enabled;
      tdSym.innerHTML = `<span class="coin-alert-bell${hasCustomAlert ? ' active' : ''}" id="bell-${sym}" title="${hasCustomAlert ? '已设自定义振幅预警' : '点击设置该币自定义振幅预警'}">${hasCustomAlert ? '🔔' : '🔕'}</span> ${coinName}`;
      tdSym.querySelector('.coin-alert-bell').addEventListener('click', (e) => {
        e.stopPropagation();
        app.togglePerCoinPopup(sym);
      });
      tr.appendChild(tdSym);

      // Price
      const tdPrice = document.createElement('td');
      tdPrice.className = 'price-col';
      tdPrice.id = `price-${sym}`;
      tdPrice.textContent = fmtPrice(meta.lastPrice);
      tr.appendChild(tdPrice);

      // 24h Change
      const tdChg = document.createElement('td');
      tdChg.id = `chg-${sym}`;
      tdChg.textContent = fmtPct(meta.priceChangePercent) + '%';
      tdChg.style.color = (meta.priceChangePercent || 0) >= 0 ? 'var(--red)' : 'var(--green)';
      tr.appendChild(tdChg);

      // Amplitude cells for each timeframe
      for (const tf of STATE.timeframes) {
        const td = document.createElement('td');
        td.className = 'amp-cell amp-stale';
        td.id = `cell-${sym}-${tf}`;
        td.textContent = '--';
        td.title = `${sym} ${CONFIG.TF_LABELS[tf]}: 加载中...`;
        this.cellRefs[`${sym}_${tf}`] = td;
        tr.appendChild(td);
      }

      // Gain cells for each gain timeframe
      for (const tf of CONFIG.GAIN_TIMEFRAMES) {
        const tdGain = document.createElement('td');
        tdGain.className = 'gain-cell gain-stale';
        tdGain.id = `gain-${sym}-${tf}`;
        tdGain.textContent = '--';
        tdGain.title = `${sym} ${CONFIG.GAIN_TF_LABELS[tf]} 涨幅: 加载中...`;
        this.cellRefs[`gain_${sym}_${tf}`] = tdGain;
        tr.appendChild(tdGain);
      }

      // Pattern cell
      const tdPattern = document.createElement('td');
      tdPattern.className = 'pattern-cell pattern-none';
      tdPattern.id = `pattern-${sym}`;
      tdPattern.textContent = '\u2014';
      tdPattern.title = `${sym} 穿线形态: 检测中...`;
      this.cellRefs[`${sym}_pattern`] = tdPattern;
      tr.appendChild(tdPattern);

      frag.appendChild(tr);
    }
    this.tableBody.appendChild(frag);

    // Populate gain + pattern cells from cache
    for (const sym of sorted) {
      for (const tf of CONFIG.GAIN_TIMEFRAMES) {
        this.updateGainCell(sym, tf);
      }
      this.updatePatternCell(sym);
      this.updatePatternRowStyle(sym);
    }

    // Apply filters
    this.applyFilters();
    this.updateStats();
  }

  updateCell(sym, tf) {
    const key = sym + '_' + tf;
    const cell = this.cellRefs[key];
    if (!cell) return;

    const data = STATE.klineCache[sym] && STATE.klineCache[sym][tf];
    if (!data) return;

    const amp = data.amplitude;
    const prevAmp = data.prevAmplitude;
    const thresholds = STATE.thresholds[tf];

    // Determine level
    let level = 'normal';
    if (thresholds) {
      if (amp >= thresholds.extreme) level = 'extreme';
      else if (amp >= thresholds.danger) level = 'danger';
      else if (amp >= thresholds.warn) level = 'warn';
    }

    // Update cell — batch className via single set
    cell.className = 'amp-cell amp-' + level;
    // Use textContent for fast updates, innerHTML only when prevAmp differs
    var ampText = amp.toFixed(2) + '%';
    if (prevAmp > 0 && Math.abs(prevAmp - amp) > 0.005) {
      cell.innerHTML = ampText + '<span class="amp-prev">(' + prevAmp.toFixed(1) + '%)</span>';
    } else {
      cell.textContent = ampText;
    }

    var levelLabel = level === 'normal' ? '正常' : level === 'warn' ? '警告' : level === 'danger' ? '高危' : '极端';
    cell.title = sym + ' ' + CONFIG.TF_LABELS[tf] + '\n当前: ' + amp.toFixed(2) + '%\n前根: ' + prevAmp.toFixed(2) + '%\n状态: ' + levelLabel + (thresholds ? '\n阈值: >' + thresholds.warn + '%/>' + thresholds.danger + '%/>' + thresholds.extreme + '%' : '\n阈值: N/A');
  }

  updatePatternCell(sym, tf) {
    // Show the best pattern across all timeframes for this symbol
    const key = `${sym}_pattern`;
    const cell = this.cellRefs[key];
    if (!cell) return;

    let bestPattern = null;
    for (const t of STATE.timeframes) {
      const pkey = `${sym}_${t}`;
      const p = STATE.patternCache[pkey];
      if (p) {
        if (!bestPattern || (p.isClosed && !bestPattern.isClosed)) {
          bestPattern = p;
        }
      }
    }

    cell.classList.remove('pattern-bullish', 'pattern-bearish', 'pattern-none');
    if (bestPattern) {
      cell.textContent = bestPattern.shortLabel;
      cell.classList.add(bestPattern.type === 'bullish_engulf' ? 'pattern-bullish' : 'pattern-bearish');
      const statusTag = bestPattern.isClosed ? '已确认' : '形成中';
      cell.title = `${sym} ${bestPattern.label} [${statusTag}]`;
    } else {
      cell.textContent = '\u2014';
      cell.classList.add('pattern-none');
      cell.title = `${sym} 无穿线形态`;
    }
  }

  updatePriceCell(sym, price) {
    const cell = document.getElementById(`price-${sym}`);
    if (cell) cell.textContent = fmtPrice(price);
  }

  // ── SORTING & FILTERING ──
  setSort(mode) {
    // Detect gain sort vs amplitude sort
    const isGainSort = mode.startsWith('gain_');
    if (isGainSort) {
      if (STATE.sortBy === mode) {
        STATE.sortAsc = !STATE.sortAsc;
      } else {
        STATE.sortBy = mode;
        STATE.sortAsc = false; // gain defaults to descending (highest first)
      }
    } else {
      if (STATE.sortBy === mode) {
        STATE.sortAsc = !STATE.sortAsc;
      } else {
        STATE.sortBy = mode;
        STATE.sortAsc = mode === 'symbol';
      }
    }
    this.updateSortUI();
    // Sort by reordering existing DOM rows (fast) instead of rebuilding (slow)
    this.sortTableRows();
  }

  updateSortUI() {
    const btns = document.querySelectorAll('#toolbar .btn');
    const isGainSort = STATE.sortBy.startsWith('gain_');
    btns.forEach(b => {
      if (b.onclick && b.onclick.toString().includes(`'${STATE.sortBy}'`)) {
        b.classList.add('active');
      } else {
        // Only deactivate buttons in the same group
        const bIsGain = b.onclick && b.onclick.toString().includes('gain_');
        const bIsAmp = b.onclick && (b.onclick.toString().includes('amp_') || b.onclick.toString().includes('symbol') || b.onclick.toString().includes('change_'));
        if ((isGainSort && bIsGain && !b.onclick.toString().includes(`'${STATE.sortBy}'`)) ||
            (!isGainSort && bIsAmp && !b.onclick.toString().includes(`'${STATE.sortBy}'`))) {
          b.classList.remove('active');
        } else if (!isGainSort && bIsGain) {
          b.classList.remove('active');
        } else if (isGainSort && bIsAmp) {
          b.classList.remove('active');
        }
      }
    });
  }

  getSortedSymbols() {
    let syms = [...STATE.symbols];
    const sortKey = STATE.sortBy;

    syms.sort((a, b) => {
      let va, vb;
      const metaA = STATE.pairMeta[a] || {};
      const metaB = STATE.pairMeta[b] || {};

      if (sortKey === 'symbol') {
        va = a; vb = b; return STATE.sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
      } else if (sortKey === 'price') {
        va = metaA.lastPrice || 0; vb = metaB.lastPrice || 0;
      } else if (sortKey === 'change_asc') {
        va = metaA.priceChangePercent || 0; vb = metaB.priceChangePercent || 0;
      } else if (sortKey === 'change_desc') {
        va = metaA.priceChangePercent || 0; vb = metaB.priceChangePercent || 0;
        return STATE.sortAsc ? va - vb : vb - va;
      } else if (sortKey.startsWith('gain_')) {
        const tf = sortKey.replace('gain_', '');
        const cacheA = STATE.gainCache[a] && STATE.gainCache[a][tf];
        const cacheB = STATE.gainCache[b] && STATE.gainCache[b][tf];
        va = cacheA ? cacheA.changePct : -999;
        vb = cacheB ? cacheB.changePct : -999;
        return STATE.sortAsc ? va - vb : vb - va;
      } else if (sortKey.startsWith('amp_')) {
        const tf = sortKey.replace('amp_', '');
        const cacheA = STATE.klineCache[a] && STATE.klineCache[a][tf];
        const cacheB = STATE.klineCache[b] && STATE.klineCache[b][tf];
        va = cacheA ? cacheA.amplitude : -1;
        vb = cacheB ? cacheB.amplitude : -1;
        return STATE.sortAsc ? va - vb : vb - va;
      }
      return STATE.sortAsc ? va - vb : vb - va;
    });

    return syms;
  }

  // DOM-based row reordering — avoids destroying/recreating all cells on sort
  sortTableRows() {
    const sorted = this.getSortedSymbols();
    const tbody = this.tableBody;
    // Detach and reattach in sorted order (appendChild moves existing nodes, no recreation)
    for (let i = 0; i < sorted.length; i++) {
      const row = this.rowRefs[sorted[i]];
      if (row) tbody.appendChild(row);
    }
    this.applyFilters();
  }

  toggleFilter(type) {
    STATE.filters[type] = !STATE.filters[type];
    this.applyFilters();
  }

  applyFilters() {
    const showExtremeOnly = STATE.filters.extreme;
    const showAlertedOnly = STATE.filters.alerted;
    const showEngulfingOnly = STATE.filters.engulfing;

    const alertedSyms = new Set(STATE.alertLog.map(a => a.sym));
    const patternSyms = new Set();
    for (const key of Object.keys(STATE.patternCache)) {
      for (const tf of STATE.timeframes) {
        if (key.endsWith('_' + tf)) {
          patternSyms.add(key.slice(0, -tf.length - 1));
          break;
        }
      }
    }

    for (const sym of STATE.symbols) {
      const row = this.rowRefs[sym];
      if (!row) continue;
      let visible = true;

      if (showExtremeOnly) {
        let hasExtreme = false;
        for (const tf of STATE.timeframes) {
          const data = STATE.klineCache[sym] && STATE.klineCache[sym][tf];
          if (data && STATE.thresholds[tf] && data.amplitude >= STATE.thresholds[tf].extreme) {
            hasExtreme = true; break;
          }
        }
        if (!hasExtreme) visible = false;
      }

      if (showAlertedOnly && !alertedSyms.has(sym)) {
        visible = false;
      }

      if (showEngulfingOnly && !patternSyms.has(sym)) {
        visible = false;
      }

      row.style.display = visible ? '' : 'none';
    }
  }

  // ── STATS ──
  updateStats() {
    let extremeCount = 0, dangerCount = 0;

    for (const sym of STATE.symbols) {
      for (const tf of STATE.timeframes) {
        const data = STATE.klineCache[sym] && STATE.klineCache[sym][tf];
        if (!data) continue;
        const th = STATE.thresholds[tf];
        if (!th) continue;
        if (data.amplitude >= th.extreme) extremeCount++;
        else if (data.amplitude >= th.danger) dangerCount++;
      }
    }

    document.getElementById('statMonitored').textContent = STATE.symbols.length;
    document.getElementById('statExtreme').textContent = extremeCount;
    document.getElementById('statDanger').textContent = dangerCount;
    document.getElementById('statAlerts').textContent = STATE.alertLog.length;

    // Gain stats
    let gainExtreme = 0, gainDanger = 0;
    for (const sym of STATE.symbols) {
      for (const tf of CONFIG.GAIN_TIMEFRAMES) {
        const data = STATE.gainCache[sym] && STATE.gainCache[sym][tf];
        if (!data) continue;
        const th = STATE.gainThresholds[tf];
        if (!th) continue;
        const absChg = Math.abs(data.changePct);
        if (absChg >= th.extreme) gainExtreme++;
        else if (absChg >= th.danger) gainDanger++;
      }
    }
    var geEl = document.getElementById('statGainExtreme');
    var gdEl = document.getElementById('statGainDanger');
    if (geEl) geEl.textContent = gainExtreme;
    if (gdEl) gdEl.textContent = gainDanger;

    if (!STATE.initDone) return;
    const nowStr = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    document.getElementById('statUpdate').textContent = nowStr;
  }

  startStatsUpdater() {
    setInterval(() => this.updateStats(), 5000);
  }

  // ── ALERT PANEL ──
  toggleAlertPanel() {
    const panel = document.getElementById('alertPanel');
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) {
      this.renderAlertPanel();
    }
  }

  renderAlertPanel() {
    const list = document.getElementById('alertPanelList');
    const recent = STATE.alertLog.slice(-100).reverse();
    if (recent.length === 0) {
      list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-secondary);">暂无告警记录</div>';
      return;
    }
    list.innerHTML = recent.map(a => {
      const d = new Date(a.time * 1000);
      const ts = d.toLocaleTimeString('zh-CN', { hour12: false });
      const levelColor = { warn: 'var(--yellow)', danger: 'var(--orange)', extreme: 'var(--red)' };
      const levelLabel = { warn: '⚠️', danger: '🔶', extreme: '🔴' };
      return `<div class="alert-entry">
        <span style="color:${levelColor[a.level]};margin-right:4px;">${levelLabel[a.level]}</span>
        <span class="alert-sym">${a.sym}</span>
        <span class="alert-amp" style="color:${levelColor[a.level]}">${a.amplitude.toFixed(2)}%</span>
        <span style="color:var(--text-secondary)">${CONFIG.TF_LABELS[a.tf]}</span>
        <span class="alert-time">${ts}</span>
      </div>`;
    }).join('');
  }

  updateAlertBadge() {
    const badge = document.getElementById('alertBadge');
    const count = STATE.alertLog.length;
    if (count > 0) {
      badge.style.display = 'inline';
      badge.textContent = count > 99 ? '99+' : count;
    } else {
      badge.style.display = 'none';
    }
  }

  clearAlerts() {
    STATE.alertLog = [];
    STATE.alerts = [];
    this.renderAlertPanel();
    this.updateAlertBadge();
    this.saveState();
    this.updateStats();
  }

  // ── SETTINGS ──
  setSymbolCount(count) {
    if (STATE.symbolCount === count) return;
    STATE.symbolCount = count;
    this.updateSymbolCountUI();
    this.saveState();
    this.reload();
  }

  updateSymbolCountUI() {
    const btns = document.querySelectorAll('#header .btn[data-count]');
    btns.forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.count) === STATE.symbolCount);
    });
  }

  // ── PER-COIN ALERT POPUP ──
  togglePerCoinPopup(sym) {
    const existing = document.querySelector('.coin-alert-popup');
    if (existing && STATE.perCoinPopupTarget === sym) {
      this.closePerCoinPopup();
      return;
    }
    this.closePerCoinPopup();
    STATE.perCoinPopupTarget = sym;

    const bell = document.getElementById(`bell-${sym}`);
    const rect = bell ? bell.getBoundingClientRect() : { left: 200, top: 200 };

    const popup = document.createElement('div');
    popup.className = 'coin-alert-popup';
    popup.id = 'perCoinPopup';

    // Use symbol without USDT for display
    const coinName = sym.replace('USDT', '');
    const saved = STATE.perCoinAlerts[sym] || { enabled: false, thresholds: {} };

    let html = `<h4>🎯 ${coinName} 自定义振幅预警
      <span style="cursor:pointer;color:var(--text-secondary)" onclick="app.closePerCoinPopup()">✕</span></h4>`;
    html += `<div style="margin-bottom:8px;font-size:11px;color:var(--text-secondary);">
      <label style="cursor:pointer;">
        <input type="checkbox" id="pcEnable_${sym}" ${saved.enabled ? 'checked' : ''}>
        启用自定义阈值（不勾选则使用全局阈值）
      </label>
    </div>`;
    html += `<div style="color:var(--text-secondary);font-size:10px;margin-bottom:4px;">警告 ≥  |  高危 ≥  |  极端 ≥</div>`;

    for (const tf of STATE.timeframes) {
      const globalTh = STATE.thresholds[tf] || { warn: 1, danger: 3, extreme: 6 };
      const customTh = saved.thresholds[tf] || {};
      // Show global default as placeholder when custom value is empty
      const ph = (v, d) => (v != null && !isNaN(v)) ? v : d;
      html += `<div class="tf-row">
        <span class="tf-label">${tf}</span>
        <input type="number" id="pcWarn_${sym}_${tf}" value="${ph(customTh.warn, globalTh.warn)}" step="0.1" min="0.1" placeholder="${globalTh.warn}" title="警告阈值 %">%
        <input type="number" id="pcDanger_${sym}_${tf}" value="${ph(customTh.danger, globalTh.danger)}" step="0.1" min="0.2" placeholder="${globalTh.danger}" title="高危阈值 %">%
        <input type="number" id="pcExtreme_${sym}_${tf}" value="${ph(customTh.extreme, globalTh.extreme)}" step="0.1" min="0.5" placeholder="${globalTh.extreme}" title="极端阈值 %">%
      </div>`;
    }

    html += `<div class="popup-actions">
      <button class="btn active" onclick="app.savePerCoinAlert('${sym}')">💾 保存</button>
      <button class="btn" onclick="app.copyGlobalToPerCoin('${sym}')">📋 从全局复制</button>
      <button class="btn danger" onclick="app.removePerCoinAlert('${sym}')">🗑 删除</button>
    </div>`;

    popup.innerHTML = html;
    document.body.appendChild(popup);

    // Position popup near the bell icon
    const popupW = 340;
    const popupH = Math.min(popup.offsetHeight || 500, window.innerHeight * 0.8);
    let left = rect.right + 10;
    let top = rect.top - 10;
    if (left + popupW > window.innerWidth - 10) left = rect.left - popupW - 10;
    if (top + popupH > window.innerHeight - 10) top = window.innerHeight - popupH - 10;
    if (top < 10) top = 10;
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';

    // Close when clicking outside
    setTimeout(() => {
      document.addEventListener('click', this._closePerCoinOnOutside, { once: true });
    }, 50);
  }

  _closePerCoinOnOutside(e) {
    const popup = document.getElementById('perCoinPopup');
    if (!popup) return;
    if (!popup.contains(e.target)) {
      app.closePerCoinPopup();
    } else {
      document.addEventListener('click', app._closePerCoinOnOutside, { once: true });
    }
  }

  closePerCoinPopup() {
    STATE.perCoinPopupTarget = null;
    const popup = document.getElementById('perCoinPopup');
    if (popup) popup.remove();
  }

  copyGlobalToPerCoin(sym) {
    for (const tf of STATE.timeframes) {
      const global = STATE.thresholds[tf] || { warn: 1, danger: 3, extreme: 6 };
      const elW = document.getElementById(`pcWarn_${sym}_${tf}`);
      const elD = document.getElementById(`pcDanger_${sym}_${tf}`);
      const elE = document.getElementById(`pcExtreme_${sym}_${tf}`);
      if (elW) elW.value = global.warn;
      if (elD) elD.value = global.danger;
      if (elE) elE.value = global.extreme;
    }
    document.getElementById(`pcEnable_${sym}`).checked = true;
  }

  savePerCoinAlert(sym) {
    const enabled = document.getElementById(`pcEnable_${sym}`).checked;
    const thresholds = {};
    for (const tf of STATE.timeframes) {
      const w = parseFloat(document.getElementById(`pcWarn_${sym}_${tf}`).value);
      const d = parseFloat(document.getElementById(`pcDanger_${sym}_${tf}`).value);
      const e = parseFloat(document.getElementById(`pcExtreme_${sym}_${tf}`).value);
      if (!isNaN(w) && !isNaN(d) && !isNaN(e)) {
        thresholds[tf] = { warn: w, danger: d, extreme: e };
      } else {
        thresholds[tf] = { ...STATE.thresholds[tf] };
      }
    }
    STATE.perCoinAlerts[sym] = { enabled, thresholds };
    this.closePerCoinPopup();
    this.updateBellIcon(sym);
    this.refreshAllCells();
    this.saveState();
    showToast(`${enabled ? '✅' : '📋'} ${sym.replace('USDT','')} ${enabled ? '已启用自定义振幅预警' : '已设为使用全局阈值'}`, false);
  }

  removePerCoinAlert(sym) {
    delete STATE.perCoinAlerts[sym];
    this.closePerCoinPopup();
    this.updateBellIcon(sym);
    this.refreshAllCells();
    this.saveState();
    showToast(`🗑 已删除 ${sym.replace('USDT','')} 的自定义预警`, false);
  }

  updateBellIcon(sym) {
    const bell = document.getElementById(`bell-${sym}`);
    if (!bell) return;
    const hasAlert = STATE.perCoinAlerts[sym] && STATE.perCoinAlerts[sym].enabled;
    bell.classList.toggle('active', hasAlert);
    bell.textContent = hasAlert ? '🔔' : '🔕';
    bell.title = hasAlert ? '已设自定义振幅预警' : '点击设置该币自定义振幅预警';
  }

  setThresholdPreset(preset) {
    if (preset === 'custom') {
      STATE.thresholdPreset = 'custom';
      this.toggleSettings();
      return;
    }
    STATE.thresholdPreset = preset;
    STATE.thresholds = JSON.parse(JSON.stringify(DEFAULT_THRESHOLDS[preset]));
    this.updateThresholdPresetUI();
    this.renderThresholdSettings();
    this.saveState();
    this.refreshAllCells();
  }

  updateThresholdPresetUI() {
    const sel = document.getElementById('thresholdPreset');
    sel.value = STATE.thresholdPreset;
  }

  renderThresholdSettings() {
    const container = document.getElementById('thresholdSettings');
    let html = '';
    for (const tf of STATE.timeframes) {
      const th = STATE.thresholds[tf] || { warn: 2, danger: 5, extreme: 10 };
      html += `<div class="threshold-row">
        <span>${CONFIG.TF_LABELS[tf]}</span>
        <label style="margin:0;">警告 ≥</label>
        <input type="number" id="thresh_${tf}_warn" value="${th.warn}" step="0.1" min="0.1">%
        <label style="margin:0;">高危 ≥</label>
        <input type="number" id="thresh_${tf}_danger" value="${th.danger}" step="0.1" min="0.2">%
        <label style="margin:0;">极端 ≥</label>
        <input type="number" id="thresh_${tf}_extreme" value="${th.extreme}" step="0.1" min="0.5">%
      </div>`;
    }
    container.innerHTML = html;

    // Render gain thresholds
    var gainContainer = document.getElementById('gainThresholdSettings');
    if (gainContainer) {
      var gainHtml = '';
      for (var _i = 0; _i < CONFIG.GAIN_TIMEFRAMES.length; _i++) {
        var gtf = CONFIG.GAIN_TIMEFRAMES[_i];
        var gth = STATE.gainThresholds[gtf] || { warn: 2, danger: 5, extreme: 10 };
        gainHtml += '<div class="threshold-row">' +
          '<span>' + CONFIG.GAIN_TF_LABELS[gtf] + '</span>' +
          '<label style="margin:0;">警告 ≥</label>' +
          '<input type="number" id="gainthresh_' + gtf + '_warn" value="' + gth.warn + '" step="0.1" min="0.1">%' +
          '<label style="margin:0;">高危 ≥</label>' +
          '<input type="number" id="gainthresh_' + gtf + '_danger" value="' + gth.danger + '" step="0.1" min="0.2">%' +
          '<label style="margin:0;">极端 ≥</label>' +
          '<input type="number" id="gainthresh_' + gtf + '_extreme" value="' + gth.extreme + '" step="0.1" min="0.5">%' +
          '</div>';
      }
      gainContainer.innerHTML = gainHtml;
    }

    document.getElementById('alertCooldown').value = STATE.alertCooldownSec;
    document.getElementById('soundEnabled').checked = STATE.soundEnabled;
    document.getElementById('notifyEnabled').checked = STATE.notifyEnabled;
    document.getElementById('dingtalkEnabled').checked = STATE.dingtalkEnabled;
    document.getElementById('dingtalkWebhook').value = STATE.dingtalkWebhook;
    document.getElementById('dingtalkCorsProxy').value = STATE.dingtalkCorsProxy || '';
    document.getElementById('dingtalkPushLevel').value = STATE.dingtalkPushLevel;
    document.getElementById('dingtalkPushPattern').checked = STATE.dingtalkPushPattern;
  }

  saveSettings() {
    for (const tf of STATE.timeframes) {
      STATE.thresholds[tf] = {
        warn: parseFloat(document.getElementById(`thresh_${tf}_warn`).value) || 1,
        danger: parseFloat(document.getElementById(`thresh_${tf}_danger`).value) || 3,
        extreme: parseFloat(document.getElementById(`thresh_${tf}_extreme`).value) || 6,
      };
    }
    // Save gain thresholds
    for (const tf of CONFIG.GAIN_TIMEFRAMES) {
      var gwEl = document.getElementById('gainthresh_' + tf + '_warn');
      var gdEl = document.getElementById('gainthresh_' + tf + '_danger');
      var geEl = document.getElementById('gainthresh_' + tf + '_extreme');
      if (gwEl && gdEl && geEl) {
        STATE.gainThresholds[tf] = {
          warn: parseFloat(gwEl.value) || 2,
          danger: parseFloat(gdEl.value) || 5,
          extreme: parseFloat(geEl.value) || 10,
        };
      }
    }
    STATE.alertCooldownSec = parseInt(document.getElementById('alertCooldown').value) || 30;
    STATE.soundEnabled = document.getElementById('soundEnabled').checked;
    STATE.notifyEnabled = document.getElementById('notifyEnabled').checked;
    STATE.dingtalkEnabled = document.getElementById('dingtalkEnabled').checked;
    STATE.dingtalkWebhook = document.getElementById('dingtalkWebhook').value.trim();
    STATE.dingtalkCorsProxy = document.getElementById('dingtalkCorsProxy').value.trim();
    STATE.dingtalkPushLevel = document.getElementById('dingtalkPushLevel').value;
    STATE.dingtalkPushPattern = document.getElementById('dingtalkPushPattern').checked;
    STATE.thresholdPreset = 'custom';
    this.updateThresholdPresetUI();
    this.refreshAllCells();
    this.saveState();
    document.getElementById('settingsModal').style.display = 'none';
  }

  resetThresholds() {
    STATE.thresholdPreset = 'crypto';
    STATE.thresholds = JSON.parse(JSON.stringify(DEFAULT_THRESHOLDS.crypto));
    STATE.gainThresholds = JSON.parse(JSON.stringify(DEFAULT_THRESHOLDS.gain));
    this.updateThresholdPresetUI();
    this.renderThresholdSettings();
    this.refreshAllCells();
    this.saveState();
  }

  toggleSettings() {
    const modal = document.getElementById('settingsModal');
    if (modal.style.display === 'none' || !modal.style.display) {
      this.renderThresholdSettings();
      modal.style.display = 'flex';
    } else {
      modal.style.display = 'none';
    }
  }

  refreshAllCells() {
    for (const sym of STATE.symbols) {
      for (const tf of STATE.timeframes) {
        this.updateCell(sym, tf);
      }
      for (const tf of CONFIG.GAIN_TIMEFRAMES) {
        this.updateGainCell(sym, tf);
      }
      this.updatePatternCell(sym);
      this.updatePatternRowStyle(sym);
    }
    this.applyFilters();
    this.updateStats();
  }

  // ── MUTE ──
  toggleMute() {
    STATE.muted = !STATE.muted;
    localStorage.setItem('amp_monitor_muted', STATE.muted);
    this.updateMuteUI();
  }

  updateMuteUI() {
    const btn = document.getElementById('muteBtn');
    btn.textContent = STATE.muted ? '🔇' : '🔊';
    btn.classList.toggle('muted', STATE.muted);
  }

  // ── DINGTALK TEST ──
  async testDingTalk() {
    const webhook = document.getElementById('dingtalkWebhook').value.trim();
    const resultEl = document.getElementById('dtTestResult');
    if (!webhook) {
      resultEl.textContent = '❌ 请先填写 Webhook 地址';
      resultEl.style.color = 'var(--red)';
      return;
    }
    resultEl.textContent = '⏳ 测试中 (直连)...';
    resultEl.style.color = 'var(--yellow)';

    const payload = {
      msgtype: 'markdown',
      markdown: {
        title: '振幅监控 - 测试消息',
        text: '## 📊 振幅监控系统\n\n**测试消息**：钉钉推送功能已成功配置！\n\n' +
          `**推送级别**: ${STATE.dingtalkPushLevel === 'warn' ? '⚠️ 警告及以上' : STATE.dingtalkPushLevel === 'danger' ? '🔶 高危及以上' : '🔴 仅极端'}\n\n` +
          `**配置时间**: ${new Date().toLocaleString('zh-CN', { hour12: false })}\n\n` +
          '> 振幅监控系统自动推送',
      },
    };
    const body = JSON.stringify(payload);

    // Strategy 1: direct
    let directOk = false;
    try {
      const resp = await fetch(webhook, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: body,
      });
      const data = await resp.json();
      if (data.errcode === 0) {
        resultEl.textContent = '✅ 推送成功！请检查钉钉群消息';
        resultEl.style.color = 'var(--green)';
        return;
      }
      directOk = true;
      resultEl.textContent = '❌ 钉钉返回错误: ' + (data.errmsg || JSON.stringify(data));
      resultEl.style.color = 'var(--red)';
      return;
    } catch(e) {
      // CORS or network error, try proxies
    }

    // Strategy 2: try custom CORS proxy first
    const customProxy = document.getElementById('dingtalkCorsProxy').value.trim();
    if (customProxy) {
      resultEl.textContent = '⏳ 测试中 (自定义代理)...';
      try {
        const data = await _fetchDingTalkViaProxy(customProxy, webhook, body);
        if (data.errcode === 0) {
          resultEl.textContent = '✅ 推送成功！请检查钉钉群消息';
          resultEl.style.color = 'var(--green)';
          return;
        }
        resultEl.textContent = '❌ 钉钉返回错误: ' + (data.errmsg || JSON.stringify(data));
        resultEl.style.color = 'var(--red)';
        return;
      } catch(e) {
        // custom proxy failed, try public
      }
    }

    // Strategy 3: try public CORS proxies
    const proxies = DINGTALK_CORS_PROXIES;
    for (let i = 0; i < proxies.length; i++) {
      resultEl.textContent = `⏳ 测试中 (代理${i + 1}/${proxies.length})...`;
      try {
        const data = await _fetchDingTalkViaProxy(proxies[i], webhook, body);
        if (data.errcode === 0) {
          resultEl.textContent = '✅ 推送成功！请检查钉钉群消息';
          resultEl.style.color = 'var(--green)';
          return;
        }
        resultEl.textContent = '❌ 钉钉返回错误: ' + (data.errmsg || JSON.stringify(data));
        resultEl.style.color = 'var(--red)';
        return;
      } catch(e) {
        continue;
      }
    }

    resultEl.textContent = '❌ 所有推送方式均失败，请检查:\n① Webhook 地址是否正确\n② 网络是否能访问外网\n③ 代理/VPN 是否正常';
    resultEl.style.color = 'var(--red)';
  }

  // ── REFRESH ──
  async manualRefresh() {
    document.getElementById('statUpdate').textContent = '刷新中...';
    document.getElementById('statUpdate').style.color = 'var(--yellow)';

    try {
      const pairs = await BinanceAPI.getTopPairs(STATE.symbolCount);
      STATE.symbols = pairs.map(p => p.symbol);
      for (const p of pairs) {
        STATE.pairMeta[p.symbol] = {
          lastPrice: p.lastPrice,
          priceChangePercent: p.priceChangePercent,
          quoteVolume: p.quoteVolume,
        };
      }

      // Fetch latest klines using fast bulk loader
      const CONCURRENCY = 20;
      const tasks = [];
      for (const sym of STATE.symbols) {
        for (const tf of STATE.timeframes) {
          tasks.push({ sym, tf });
        }
        // Also fetch gain-only timeframes
        for (const tf of CONFIG.GAIN_EXTRA_TF) {
          tasks.push({ sym, tf, isGainExtra: true });
        }
      }
      for (let i = 0; i < tasks.length; i += CONCURRENCY) {
        const batch = tasks.slice(i, i + CONCURRENCY);
        await Promise.all(batch.map(async ({ sym, tf, isGainExtra }) => {
          try {
            const candles = await BinanceAPI.fetchKlinesBulk(sym, tf, CONFIG.KLINE_LIMIT);
            if (isGainExtra) {
              this.processInitialGainKlines(sym, tf, candles);
            } else {
              this.processInitialKlines(sym, tf, candles);
            }
          } catch(e) {}
        }));
      }

      this.buildTableBody();
      this.startWebSocket();
      this.updateStats();
      document.getElementById('pairCount').textContent = `币种: ${STATE.symbols.length}`;
      document.getElementById('statUpdate').textContent = '✓ 刷新完成';
      document.getElementById('statUpdate').style.color = 'var(--green)';
    } catch(e) {
      console.error('[AmplitudeMonitor] refresh error:', e);
      document.getElementById('statUpdate').textContent = '✗ 刷新失败';
      document.getElementById('statUpdate').style.color = 'var(--red)';
    }
  }

  startPeriodicRefresh() {
    // Refresh pair metadata every 60 seconds
    setInterval(async () => {
      try {
        const pairs = await BinanceAPI.getTopPairs(STATE.symbolCount);
        for (const p of pairs) {
          if (STATE.pairMeta[p.symbol]) {
            STATE.pairMeta[p.symbol].lastPrice = p.lastPrice;
            STATE.pairMeta[p.symbol].priceChangePercent = p.priceChangePercent;
          }
        }
        // Update price column
        for (const sym of STATE.symbols) {
          const meta = STATE.pairMeta[sym];
          if (meta) this.updatePriceCell(sym, meta.lastPrice);
        }
        document.getElementById('statUpdate').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
      } catch(e) {}
    }, 60000);
  }

  async reload() {
    this.disconnectWS();
    STATE.klineCache = {};
    STATE.gainCache = {};
    STATE.gainKlineCache = {};
    STATE.pairMeta = {};
    STATE.patternCache = {};
    await this.loadData();
    this.startWebSocket();
  }

  // ── CLOCK ──
  startClock() {
    const updateClock = () => {
      const now = new Date();
      const bjTime = new Date(now.getTime() + (8 * 60 * 60 * 1000) + now.getTimezoneOffset() * 60 * 1000);
      const days = ['日','一','二','三','四','五','六'];
      const str = bjTime.getUTCFullYear() + '-' +
        String(bjTime.getUTCMonth() + 1).padStart(2,'0') + '-' +
        String(bjTime.getUTCDate()).padStart(2,'0') + ' ' +
        '周' + days[bjTime.getUTCDay()] + ' ' +
        String(bjTime.getUTCHours()).padStart(2,'0') + ':' +
        String(bjTime.getUTCMinutes()).padStart(2,'0') + ':' +
        String(bjTime.getUTCSeconds()).padStart(2,'0') + ' BJT';
      document.getElementById('clock').textContent = str;
    };
    updateClock();
    STATE.clockTimer = setInterval(updateClock, 1000);
  }
}

// ==================== GLOBAL HELPERS ====================
function updateConnectionUI() {
  const dot = document.getElementById('connectionDot');
  if (STATE.wsConnected) {
    dot.className = '';
    dot.style.background = 'var(--green)';
    dot.title = 'WebSocket 已连接';
  } else {
    dot.className = 'disconnected';
    dot.style.background = 'var(--red)';
    dot.title = 'WebSocket 已断开';
  }
}

// ==================== BOOTSTRAP ====================
const app = new AmplitudeMonitor();

document.addEventListener('DOMContentLoaded', () => {
  app.init();
});

// Close settings modal on outside click
document.addEventListener('click', (e) => {
  const modal = document.getElementById('settingsModal');
  if (modal && e.target === modal) {
    modal.style.display = 'none';
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey) return;
  switch(e.key.toLowerCase()) {
    case 'm': app.toggleMute(); break;
    case 'r': app.manualRefresh(); break;
    case 's': app.toggleSettings(); break;
    case 'a': app.toggleAlertPanel(); break;
    case 'escape': app.closePerCoinPopup(); break;
  }
});
</script>
